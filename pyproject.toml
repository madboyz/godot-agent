[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godot-knowledge"
version = "0.1.0"
description = "Versioned local Godot knowledge with source-backed MCP queries"
requires-python = ">=3.12"
dependencies = ["mcp>=1.20,<2", "platformdirs>=4,<5", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "pyyaml>=6,<7"]

[project.scripts]
godot-knowledge = "godot_knowledge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/godot_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"skills/godot-knowledge" = "godot_knowledge/bundled_skills/godot-knowledge"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

